<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinemator</title>
  <meta name="description" content="Stream video from BitTorrent sources with on-demand HLS playback.">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">cinemator</span>
      </div>
      <div class="top-actions">
        <button class="auth-logout" id="logoutBtn" type="button" hidden>Sign out</button>
        <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">
          <span class="icon" id="icon-moon" style="display:none;">☾</span>
          <span class="icon" id="icon-sun"  style="display:none;">☼</span>
        </button>
      </div>
    </div>
  </header>
  <main class="app-shell">
    <section class="source-panel" aria-label="Torrent source">
      <form id="form" class="source-form" autocomplete="off">
        <label class="source-label" for="magnet">Magnet link</label>
        <div class="input-row">
          <input id="magnet" type="text" class="input-style" placeholder="magnet:?xt=urn:btih:..." spellcheck="false" required>
          <button type="submit" id="nextBtn" class="input-style">Load</button>
        </div>
        <div class="msg" id="magnetMsg"></div>
      </form>
    </section>

    <section class="downloads-panel panel" aria-label="Saved downloads">
      <div class="downloads-head">
        <h2>Downloads</h2>
      </div>
      <div id="downloadsList" class="downloads-list"></div>
      <div class="msg" id="downloadsMsg"></div>
    </section>

    <section class="workspace" aria-live="polite">
      <div class="control-stack">
        <div class="step panel" id="step-files" style="display:none">
          <div class="track-row">
            <label for="filelist">File:</label>
            <select id="filelist" class="input-style"></select>
          </div>
          <button id="selectTracks" type="button" class="input-style">Select tracks</button>
          <div class="msg" id="fileMsg"></div>
        </div>

        <div class="step panel" id="step-tracks" style="display:none">
          <div class="track-row">
            <label for="audioSelect">Audio:</label>
            <select id="audioSelect" class="input-style"></select>
          </div>
          <div class="track-row">
            <label for="subtitleSelect">Subtitles:</label>
            <select id="subtitleSelect" class="input-style"></select>
          </div>
          <div class="track-row" id="subtitleDelayRow" style="display:none">
            <span class="track-label">Sub delay:</span>
            <div class="delay-controls">
              <button type="button" id="subDelayMinus" class="input-style small-btn">-0.5s</button>
              <div id="subDelayValue" class="delay-value">0.0s</div>
              <button type="button" id="subDelayPlus" class="input-style small-btn">+0.5s</button>
            </div>
          </div>
          <button id="play" type="button" class="input-style">Play</button>
          <div class="msg" id="trackMsg"></div>
        </div>

        <div id="warn-container">
          <div class="warning" id="warnMsg" hidden>
            <div class="warning-inner">
              <span class="warning-icon" aria-hidden="true">!</span>
              <div class="warning-text">
                <strong id="warn-title">Preparing video</strong>
                <span id="warn-detail">The server is downloading and transcoding the requested part.</span>
                <span id="warn-status">Please stay on this page until playback begins.</span>
                <span id="warn-extra" hidden></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="player-block" class="player-stage step" style="display:none">
        <video id="video" controls autoplay playsinline></video>
        <div class="player-toolbar">
          <button id="mediaInfoBtn" class="media-info-button" type="button" hidden>Media info</button>
        </div>
        <div class="msg" id="playerMsg"></div>
      </div>
    </section>
  </main>
  <dialog id="mediaInfoDialog" class="media-info-dialog" aria-labelledby="mediaInfoTitle">
    <div class="media-info-head">
      <h2 id="mediaInfoTitle">Media info</h2>
      <button id="mediaInfoClose" class="media-info-close" type="button" aria-label="Close">×</button>
    </div>
    <section class="media-info-section" aria-labelledby="mediaSourceTitle">
      <h3 id="mediaSourceTitle">Source</h3>
      <dl>
        <div id="mediaVideoRow"><dt>Video</dt><dd id="mediaVideo"></dd></div>
        <div id="mediaColorRow"><dt>Color</dt><dd id="mediaColor"></dd></div>
        <div id="mediaBitrateRow"><dt>Bitrate</dt><dd id="mediaBitrate"></dd></div>
        <div id="mediaAudioRow"><dt>Audio</dt><dd id="mediaAudio"></dd></div>
      </dl>
    </section>
    <section class="media-info-section" aria-labelledby="mediaPlaybackTitle">
      <h3 id="mediaPlaybackTitle">Playback</h3>
      <dl>
        <div><dt>Mode</dt><dd id="mediaPlaybackMode">Preparing</dd></div>
        <div id="mediaDecisionRow"><dt>Decision</dt><dd id="mediaDecision"></dd></div>
      </dl>
    </section>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13"></script>
  <script src="index.js"></script>
</body>
</html>
