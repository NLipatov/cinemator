<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinemator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◼</span>
      <span class="brand-name">Cinemator</span>
    </div>
    <div class="top-actions">
      <div class="theme-toggle" id="themeToggle" title="Switch theme">
        <span class="icon" id="icon-moon" style="display:none;">🌙</span>
        <span class="icon" id="icon-sun"  style="display:none;">☀️</span>
      </div>
    </div>
  </header>
  <div class="card">
    <h2>Cinemator – Universal HLS Player</h2>
    <form id="form" class="step" autocomplete="off">
      <div class="input-row">
        <input id="magnet" type="text" class="input-style" placeholder="Magnet link" spellcheck="false" required>
        <button type="submit" id="nextBtn" class="input-style">Next</button>
      </div>
      <div class="msg" id="magnetMsg"></div>
    </form>
    <div class="step" id="step-files" style="display:none">
      <select id="filelist" class="input-style"></select>
      <button id="selectTracks" type="button" class="input-style">Select tracks</button>
      <div class="msg" id="fileMsg"></div>
    </div>
    <div class="step" id="step-tracks" style="display:none">
      <div class="track-row">
        <label for="audioSelect">Audio:</label>
        <select id="audioSelect" class="input-style"></select>
      </div>
      <div class="track-row">
        <label for="subtitleSelect">Subtitles:</label>
        <select id="subtitleSelect" class="input-style"></select>
      </div>
      <div class="track-row" id="subtitleDelayRow" style="display:none">
        <label>Sub delay:</label>
        <div class="delay-controls">
          <button type="button" id="subDelayMinus" class="input-style small-btn">-0.5s</button>
          <div id="subDelayValue" class="delay-value">0.0s</div>
          <button type="button" id="subDelayPlus" class="input-style small-btn">+0.5s</button>
        </div>
      </div>
      <button id="play" type="button" class="input-style">Play</button>
      <div class="msg" id="trackMsg"></div>
    </div>
    <div id="warn-container"></div>
    <div id="player-block" class="step" style="display:none">
      <video id="video" controls autoplay playsinline></video>
      <div class="msg" id="playerMsg"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.5"></script>
  <script src="index.js"></script>
</body>
</html>
