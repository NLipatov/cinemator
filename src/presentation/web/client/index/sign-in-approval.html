<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Approve sign-in · Cinemator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/index.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body class="device-body">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">cinemator</span>
      </div>
      <div class="top-actions">
        <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">
          <span class="icon" id="icon-moon" style="display:none;">☾</span>
          <span class="icon" id="icon-sun" style="display:none;">☼</span>
        </button>
      </div>
    </div>
  </header>
  <main class="device-shell">
    <section class="device-approval" id="deviceApproval">
      <div class="login-copy">
        <h1 id="deviceTitle">Allow sign-in?</h1>
        <p id="deviceDescription">A device is requesting access to Cinemator. Only continue if its code matches.</p>
      </div>
      <strong class="approval-code" id="approvalCode">Loading…</strong>
      <span class="device-expiry" id="approvalExpiry"></span>
      <button id="allowDevice" type="button">Allow</button>
      <div class="msg" id="approvalMessage" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="/sign-in-approval.js"></script>
</body>
</html>
