<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title data-i18n="auth.pageTitle">Sign in · Cinemator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/index.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body class="login-body">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">cinemator</span>
      </div>
      <div class="top-actions">
        <select id="languageSelect" aria-label="Language" data-i18n-aria-label="common.language">
          <option value="en" lang="en">English</option>
          <option value="ru" lang="ru">Русский</option>
          <option value="zh-Hans" lang="zh-Hans">简体中文</option>
        </select>
        <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" data-i18n-title="common.theme" aria-label="Switch theme" data-i18n-aria-label="common.theme">
          <span class="icon" id="icon-moon" style="display:none;">☾</span>
          <span class="icon" id="icon-sun" style="display:none;">☼</span>
        </button>
      </div>
    </div>
  </header>
  <main class="login-shell">
    <section class="login-content">
      <div class="login-copy">
        <h1 data-i18n="auth.signIn">Sign in</h1>
        <p data-i18n="auth.description">Enter the password configured by the server owner.</p>
      </div>
      <form class="login-form" id="loginForm">
        <label for="password" data-i18n="auth.password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" type="submit" data-i18n="auth.continue">Continue</button>
        <div class="msg" id="loginMessage" role="alert" aria-live="polite"></div>
      </form>
      <div class="login-divider"><span data-i18n="auth.phone">or sign in with your phone</span></div>
      <div class="device-login">
        <div class="qr-frame">
          <img id="deviceQRCode" alt="QR code for signing in with another device" data-i18n-alt="auth.qrAlt" hidden>
          <div class="qr-placeholder" id="qrPlaceholder" data-i18n="auth.generatingQR">Generating QR code…</div>
        </div>
        <div class="device-login-copy">
          <p data-i18n="auth.scan">Scan with a device already signed in to Cinemator.</p>
          <strong class="device-code" id="deviceCode"></strong>
          <span class="device-expiry" id="deviceExpiry"></span>
        </div>
        <div class="msg" id="deviceMessage" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <script src="/theme.js"></script>
  <script type="module" src="/login.js"></script>
</body>
</html>
