<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinemator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">cinemator</span>
        <span class="brand-version" id="appVersion" hidden></span>
      </div>
      <div class="top-actions">
        <select id="languageSelect" aria-label="Language" data-i18n-aria-label="common.language">
          <option value="en" lang="en">English</option>
          <option value="ru" lang="ru">Русский</option>
          <option value="zh-Hans" lang="zh-Hans">简体中文</option>
          <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
        </select>
        <button class="auth-logout" id="logoutBtn" type="button" hidden data-i18n="auth.signOut">Sign out</button>
        <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" data-i18n-title="common.theme" aria-label="Switch theme" data-i18n-aria-label="common.theme">
          <span class="icon" id="icon-moon" style="display:none;">☾</span>
          <span class="icon" id="icon-sun"  style="display:none;">☼</span>
        </button>
      </div>
    </div>
  </header>
  <main class="app-shell">
    <section id="playerWorkspace" hidden class="workspace" aria-label="Video player" data-i18n-aria-label="player.workspace">
      <div id="player-block" class="player-stage step" style="display:none">
        <div class="video-frame">
          <video id="video" controls autoplay playsinline></video>
          <div class="player-preparation" id="warnMsg" hidden>
            <div class="preparation-content">
              <span class="loader preparation-spinner" aria-hidden="true"></span>
              <div class="preparation-copy">
                <strong id="preparationStage" role="status" data-i18n="progress.selectedVideo">Preparing selected video…</strong>
                <progress id="preparationProgress" max="1" aria-label="Video download progress" data-i18n-aria-label="progress.videoDownloaded" hidden></progress>
                <span id="preparationDetails"></span>
                <span id="preparationVideo"></span>
                <span id="warn-extra" hidden></span>
              </div>
            </div>
          </div>
        </div>
        <div class="msg" id="playerMsg" role="status" aria-live="polite"></div>
      </div>

      <div class="control-stack">
        <div class="step player-controls" id="step-files" style="display:none">
          <div class="player-toolbar">
            <div id="selectedFile" class="selected-file"></div>
            <div class="player-settings">
            <div id="videoNavigation" class="player-setting video-navigation" hidden>
              <button id="previousVideo" type="button" class="settings-toggle video-skip" title="Previous video" data-i18n-title="player.previousVideo" aria-label="Previous video" data-i18n-aria-label="player.previousVideo" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
              </button>
              <button id="videoMenuButton" type="button" class="settings-toggle" aria-expanded="false" aria-controls="videoMenu" aria-haspopup="menu" hidden>
                <span id="videoMenuLabel"></span>
                <span aria-hidden="true">▾</span>
              </button>
              <button id="nextVideo" type="button" class="settings-toggle video-skip" title="Next video" data-i18n-title="player.nextVideo" aria-label="Next video" data-i18n-aria-label="player.nextVideo" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
              </button>
            </div>
            <div class="player-setting">
              <button id="audioMenuButton" type="button" class="settings-toggle" aria-expanded="false" aria-controls="audioMenu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5zM15 8a6 6 0 0 1 0 8M18 4a11 11 0 0 1 0 16"/></svg>
                <span data-i18n="player.sound">Sound</span>
              </button>
              <div id="audioMenu" class="settings-popup" role="region" aria-labelledby="audioMenuButton" hidden>
                <div class="track-row">
                  <label for="audioSelect" data-i18n="player.audio">Sound</label>
                  <select id="audioSelect" class="input-style"></select>
                </div>
              </div>
            </div>
            <div class="player-setting">
              <button id="subtitlesMenuButton" type="button" class="settings-toggle" aria-expanded="false" aria-controls="subtitlesMenu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M5 11h5m4 0h5M5 15h8m3 0h3"/></svg>
                <span data-i18n="player.subtitles">Subtitles</span>
              </button>
              <div id="subtitlesMenu" class="settings-popup" role="region" aria-labelledby="subtitlesMenuButton" hidden>
                <div class="track-row">
                  <label for="subtitleSelect" data-i18n="player.subtitles">Subtitles</label>
                  <select id="subtitleSelect" class="input-style"></select>
                </div>
          <div class="track-row" id="subtitleDelayRow" style="display:none">
            <span class="field-label" id="subtitleDelayLabel" data-i18n="player.subtitleDelay">Subtitle offset</span>
            <div class="delay-controls" role="group" aria-labelledby="subtitleDelayLabel">
              <button type="button" id="subDelayMinus" class="input-style small-btn" data-i18n="player.seconds" data-i18n-params='{"value":"-0.5"}'>-0.5s</button>
              <div id="subDelayValue" class="delay-value" data-i18n="player.seconds" data-i18n-params='{"value":"0.0"}'>0.0s</div>
              <button type="button" id="subDelayPlus" class="input-style small-btn" data-i18n="player.seconds" data-i18n-params='{"value":"+0.5"}'>+0.5s</button>
            </div>
          </div>
              </div>
            </div>
            </div>
            <button id="play" type="button" class="input-style" data-i18n="player.retry">Retry</button>
            <button id="closePlayer" type="button" class="settings-toggle close-player" title="Close player" data-i18n-title="player.close" aria-label="Close player" data-i18n-aria-label="player.close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
            </button>
          </div>
          <div class="msg" id="fileMsg" role="status" aria-live="polite"></div>
          <div class="msg" id="trackMsg" role="status" aria-live="polite"></div>
        </div>


      </div>
    </section>

    <section class="downloads-panel" aria-label="Saved downloads" data-i18n-aria-label="downloads.saved">
      <div class="downloads-head">
        <div class="downloads-heading">
          <h2 data-i18n="downloads.title">Downloads</h2>
          <span class="downloads-count" id="downloadsCount" aria-hidden="true">0</span>
        </div>
        <button id="addDownloadBtn" type="button" aria-expanded="false" aria-controls="sourcePanel">
          <span class="add-icon" aria-hidden="true"></span>
          <span id="addDownloadLabel" data-i18n="downloads.add">Add</span>
        </button>
      </div>
      <section id="sourcePanel" class="source-panel" aria-label="Add a download" data-i18n-aria-label="player.source" hidden>
        <form id="form" class="source-form" autocomplete="off">
          <label class="source-label" for="magnet" data-i18n="player.magnet">Magnet link</label>
          <div class="input-row">
            <input id="magnet" type="text" class="input-style" placeholder="magnet:?xt=urn:btih:..." spellcheck="false" required>
            <button type="submit" id="nextBtn" class="input-style" data-i18n="player.load">Open</button>
          </div>
          <div class="msg" id="magnetMsg" role="status" aria-live="polite"></div>
        </form>
      </section>
      <div id="downloadsList" class="downloads-list"></div>
      <div class="msg" id="downloadsMsg"></div>
    </section>
  </main>
  <div id="videoMenu" class="video-file-menu" role="menu" aria-label="Video" data-i18n-aria-label="player.video" hidden></div>

  <template id="downloadRowTemplate">
    <div class="download-row">
      <button type="button" class="download-open" data-action="open">
        <span class="download-thumbnail" aria-hidden="true">
          <img class="download-preview" alt="" loading="lazy" decoding="async">
          <span class="download-play-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 4.5v15L20 12z"/></svg>
          </span>
          <span class="download-duration" hidden></span>
          <span class="download-watched" hidden></span>
        </span>
        <span class="download-caption">
          <span class="download-title"></span>
          <span class="download-expiry"></span>
        </span>
      </button>
      <button type="button" class="download-videos" data-action="choose-video" aria-haspopup="menu" aria-expanded="false" aria-controls="videoMenu" hidden></button>
      <div class="download-menu">
        <button type="button" class="download-more" data-action="toggle-menu"
          aria-label="Download actions" data-i18n-aria-label="downloads.actions" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </button>
        <div class="download-options" role="menu" hidden>
          <div class="download-meta">
            <span class="download-size"></span>
            <span class="download-meta-text"></span>
          </div>
          <button type="button" class="download-menu-item" data-action="restart" role="menuitem" data-i18n="downloads.restart">Watch from the beginning</button>
          <div class="download-extend-group" role="group" aria-label="Extend storage time" data-i18n-aria-label="downloads.extend">
            <span class="download-menu-label" data-i18n="downloads.extend">Extend storage time</span>
            <button type="button" class="download-menu-item" data-action="extend" data-days="1" role="menuitem" data-i18n="downloads.days" data-i18n-params='{"count":1}'>1 day</button>
            <button type="button" class="download-menu-item" data-action="extend" data-days="7" role="menuitem" data-i18n="downloads.days" data-i18n-params='{"count":7}'>7 days</button>
            <button type="button" class="download-menu-item" data-action="extend" data-days="30" role="menuitem" data-i18n="downloads.days" data-i18n-params='{"count":30}'>30 days</button>
          </div>
          <button type="button" class="download-menu-item delete" data-action="delete" role="menuitem" data-i18n="downloads.delete">Delete</button>
        </div>
      </div>
      <div class="download-card-status" hidden></div>
      <progress class="download-progress" max="1" aria-label="Video download progress" data-i18n-aria-label="progress.videoDownloaded" hidden></progress>
    </div>
  </template>
  <script
    src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"
    integrity="sha384-cciJ0zi8d1uMKC2zJd7jvPY4HQt7W4ByUI/FlMkltvBi31aW61rcpVBhpmW8/NwX"
    crossorigin="anonymous"
  ></script>
  <script src="/theme.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
