<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinemator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="index.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-name">cinemator</span>
        <span class="brand-version" id="appVersion" hidden></span>
      </div>
      <div class="top-actions">
        <button class="auth-logout" id="logoutBtn" type="button" hidden>Sign out</button>
        <button class="theme-toggle" id="themeToggle" type="button" title="Switch theme" aria-label="Switch theme">
          <span class="icon" id="icon-moon" style="display:none;">☾</span>
          <span class="icon" id="icon-sun"  style="display:none;">☼</span>
        </button>
      </div>
    </div>
  </header>
  <main class="app-shell">
    <section class="source-panel" aria-label="Torrent source">
      <form id="form" class="source-form" autocomplete="off">
        <label class="source-label" for="magnet">Magnet link</label>
        <div class="input-row">
          <input id="magnet" type="text" class="input-style" placeholder="magnet:?xt=urn:btih:..." spellcheck="false" required>
          <button type="submit" id="nextBtn" class="input-style">Load</button>
        </div>
        <div class="msg" id="magnetMsg"></div>
      </form>
    </section>

    <section class="workspace" aria-label="Playback workspace">
      <div id="player-block" class="player-stage step" style="display:none">
        <video id="video" controls autoplay playsinline></video>
        <div class="msg" id="playerMsg" role="status" aria-live="polite"></div>
      </div>

      <div class="control-stack">
        <div class="step panel" id="step-files" style="display:none">
          <label class="field-label" for="filelist">Video file</label>
          <select id="filelist" class="input-style"></select>
          <button id="selectTracks" type="button" class="input-style">Select tracks</button>
          <div class="msg" id="fileMsg" role="status" aria-live="polite"></div>
        </div>

        <div class="step panel" id="step-tracks" style="display:none">
          <h2 class="panel-title">Playback</h2>
          <div class="track-row">
            <label for="audioSelect">Audio</label>
            <select id="audioSelect" class="input-style"></select>
          </div>
          <div class="track-row">
            <label for="subtitleSelect">Subtitles</label>
            <select id="subtitleSelect" class="input-style"></select>
          </div>
          <div class="track-row" id="subtitleDelayRow" style="display:none">
            <span class="field-label" id="subtitleDelayLabel">Sub delay</span>
            <div class="delay-controls" role="group" aria-labelledby="subtitleDelayLabel">
              <button type="button" id="subDelayMinus" class="input-style small-btn">-0.5s</button>
              <div id="subDelayValue" class="delay-value">0.0s</div>
              <button type="button" id="subDelayPlus" class="input-style small-btn">+0.5s</button>
            </div>
          </div>
          <button id="play" type="button" class="input-style">Play</button>
          <div class="msg" id="trackMsg" role="status" aria-live="polite"></div>
        </div>

        <div id="warn-container">
          <div class="warning" id="warnMsg" hidden>
            <div class="warning-inner">
              <span class="warning-icon" aria-hidden="true">!</span>
              <div class="warning-text">
                <span>Server is downloading and preparing the video.</span>
                <span>This may take several minutes for large torrents.</span>
                <strong>Please stay on this page until playback begins.</strong>
                <span id="warn-extra" hidden></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="downloads-panel" aria-label="Saved downloads">
      <div class="downloads-head">
        <h2>Downloads</h2>
      </div>
      <div id="downloadsList" class="downloads-list"></div>
      <div class="msg" id="downloadsMsg"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.5"></script>
  <script src="index.js"></script>
</body>
</html>
