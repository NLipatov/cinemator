services:
  cinemator:
    image: nlipatov/cinemator:${CINEMATOR_TAG:-latest}
    restart: unless-stopped
    environment:
      CINEMATOR_PASSWORD_HASH: ${CINEMATOR_PASSWORD_HASH:-}
      CINEMATOR_SESSION_SECRET: ${CINEMATOR_SESSION_SECRET:-}
      CINEMATOR_MAX_TORRENT_CACHE_BYTES: ${CINEMATOR_MAX_TORRENT_CACHE_BYTES:-12884901888}
      CINEMATOR_MAX_CACHE_BYTES: ${CINEMATOR_MAX_CACHE_BYTES:-2147483648}
      CINEMATOR_TORRENT_READAHEAD_BYTES: ${CINEMATOR_TORRENT_READAHEAD_BYTES:-67108864}
      CINEMATOR_HLS_SEGMENT_SECONDS: ${CINEMATOR_HLS_SEGMENT_SECONDS:-6}
      CINEMATOR_HLS_WINDOW_SEGMENTS: ${CINEMATOR_HLS_WINDOW_SEGMENTS:-5}
      CINEMATOR_MAX_TRANSCODES: ${CINEMATOR_MAX_TRANSCODES:-1}
      CINEMATOR_MAX_QUEUED_JOBS: ${CINEMATOR_MAX_QUEUED_JOBS:-4}
      CINEMATOR_MAX_JOBS_PER_STREAM: ${CINEMATOR_MAX_JOBS_PER_STREAM:-3}
      CINEMATOR_MAX_ACTIVE_STREAMS: ${CINEMATOR_MAX_ACTIVE_STREAMS:-16}
    expose:
      - "8000"
    ports:
      - "42069:42069/tcp"
      - "42069:42069/udp"
    volumes:
      - /var/tmp/cinemator:/var/tmp/cinemator

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - cinemator
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
